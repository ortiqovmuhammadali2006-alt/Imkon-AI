# Har bir push va pull request'da avtomatik tekshiruv:
#  - frontend: ESLint, TypeScript, production build
#  - backend: bazani yaratish (migratsiya), serverni ishga tushirish va integratsion testlar (OpenAI talab qilinmaydi)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: imkon
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: imkon_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U imkon -d imkon_ai"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PORT: 5000
      CLIENT_URL: http://localhost:3000
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: imkon
      DB_PASSWORD: ci-postgres-password
      DB_NAME: imkon_ai
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-admin-password-2026
      EDGE_TTS: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run migrate
      - name: Serverni ishga tushirish
        run: |
          npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5000/api/health && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm test
      - name: Server logi (xato bo'lsa)
        if: failure()
        run: cat server.log
